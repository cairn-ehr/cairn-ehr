name: Closing-keyword guard

# Refuses a PR whose own text hands GitHub a closing reference the text says is
# NOT a close — and, on every PR, prints which issues the merge will close.
#
# Three sources are scanned, because GitHub parses all three: the PR body, the
# PR TITLE (it becomes the merge commit's body — `git log --format=%b` on any
# merge here prints the title verbatim), and every commit message in the PR.
#
# Why this exists. GitHub closes an issue when a merged PR body or commit message
# puts `close`/`fix`/`resolve` (any tense) immediately before a reference to it.
# The parser reads adjacency, never meaning, so all three of these closed an issue
# while saying the opposite, in this repository:
#
#     "It does not fix #500"           -> #500 closed  (PR #526)
#     "It does close #101 item 1"      -> #101 closed  (PR #533)
#     "Filed rather than fixed: #534"  -> #534 closed  (PR #539)
#
# Seven issues were lost that way — #101, #115, #434, #441, #468, #500, #534 —
# including the tracking issue for the disaster-recovery work under construction
# at the time, and one that stayed wrongly closed for eight weeks. Nothing
# reported any of it: the issues simply stopped existing as far as any triage,
# ROADMAP cross-check or `/techdebt-loop` run could tell. House rule 5 says a
# known defect must never pass silently, so the check is mechanical rather than a
# convention in CONTRIBUTING.md — a convention is exactly what failed seven times.
#
# The commit convention `fix(#500):` is SAFE and is deliberately not flagged: the
# parenthesis breaks the adjacency GitHub requires (proof: `fix(#288)` and
# `fix(#530)` sit on `main` with both issues open). A guard that fired on the
# house commit style would be switched off inside a week.
#
# `edited` is in the trigger list because the body is editable after opening, and
# an edit is the most likely moment for this defect to arrive.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: closing-keywords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: closing-keyword guard
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so the commit range below can be walked at all. With the
      # default shallow clone the range's endpoints are absent and `git log`
      # aborts with `fatal: Invalid revision range`, which `set -e` turns into a
      # failed step — loud, not silent. The SILENT shape this guard fears is a
      # range that resolves to nothing, which `--require` below refuses.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The guard's OWN tests run first: if the checker rots, this step is what
      # says so, before its silence can be mistaken for an all-clear. (#444's
      # lesson is the narrower one that a check which does not block is not a
      # gate — which still applies to this whole workflow until #444 promotes
      # it into branch protection.)
      - name: The guard's own tests
        run: |
          set -euo pipefail
          python3 scripts/tests/check_closing_keywords_test.py
          bash scripts/tests/collect_pr_text_test.sh

      # The title and body arrive through the environment, never through `${{ }}`
      # interpolation inside the script: both are attacker-controlled text and
      # interpolation would splice them into the shell.
      - name: Collect the text GitHub will parse
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/collect_pr_text.sh

      # tee under `pipefail` so the report reaches the job summary AND the script's
      # exit status still decides the step. Without pipefail, tee's success would
      # mask a refusal.
      - name: Check the PR title, body and commit messages
        run: |
          set -euo pipefail
          # `--require commit-messages.txt`: a pull request always carries at
          # least one commit, so an empty commit list is broken plumbing, not
          # clean text — and without this the report would print a confident
          # all-clear over a scan that read no commit message at all, because the
          # body was present and clean. The title and body may each be empty.
          python3 scripts/check_closing_keywords.py \
            --require commit-messages.txt \
            pr-title.txt pr-body.txt commit-messages.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

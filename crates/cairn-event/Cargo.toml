[package]
name = "cairn-event"
version = "0.0.0"
description = "Cairn walking skeleton — the signed event envelope: canonical bytes, content-addressing, COSE_Sign1/Ed25519 signing and verification, BLAKE3 blob addressing."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Inherit the central workspace lint policy (#144).
[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"           # CBOR encode/decode of the canonical body
coset = "0.3"              # COSE_Sign1 (RFC 9052) signature envelope
ed25519-dalek = "3"        # Ed25519 (RFC 8032)
sha2 = "0.11"              # event content address (sha2-256, multihash 0x12)
blake3 = "1"               # blob content address (multihash 0x1e)
bao = "0.13"               # BLAKE3 verified streaming: per-slice content verification (§4.4)
uuid = { version = "1", features = ["v7"] }
getrandom = "0.4"          # key generation entropy (0.4 matches uuid/rand)
hex = "0.4"
serde_bytes = "0.11"       # CBOR byte-string encoding for reserved inline blob bytes
thiserror = "1"
# ADR-0052 born-sealed bodies: AEAD seal + DEK wrap plane. Licenses checked
# (house rule 1): chacha20poly1305 MIT/Apache-2.0, x25519-dalek BSD-3-Clause,
# hkdf MIT/Apache-2.0, zeroize MIT/Apache-2.0 — all AGPL-3.0-compatible.
# zeroize is NOT a default feature in 0.11 (it was mandatory in 0.10): without it
# the cipher's Drop no longer wipes its internal key copy — re-enable it explicitly
# so DEK/KEK copies inside XChaCha20Poly1305 are still zeroed on drop (PR #319 review).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
zeroize = "1"

[dev-dependencies]
# First property-test harness (#212): floor twins take attacker-controlled input, so
# their pure Rust mirrors get generative coverage. License checked (house rule 1):
# proptest is MIT OR Apache-2.0 — AGPL-3.0-compatible (cargo-deny enforces).
proptest = "1"

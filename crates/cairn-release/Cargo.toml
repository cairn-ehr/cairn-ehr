[package]
name = "cairn-release"
version = "0.0.0"
publish = false
description = "Cairn signed releases (ADR-0055): the trust-root / manifest / bundle documents, their canonical CBOR encoding, and (Task 3) the verifier."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Every dependency is already in the tree (AGPL-compatible, checked by cargo-deny);
# serde_bytes is already used by cairn-event. cairn-event supplies the detached signatures.
[dependencies]
cairn-event = { path = "../cairn-event" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# The installer status file (`InstallerStatus`), read by the window as well as the installer.
serde_json = "1"
ciborium = "0.2"
sha2 = "0.11"
thiserror = "1"
# Optional, for the steward's offline signing tool (the `cairn-release` binary) only: key files,
# sidecar JSON and CLI parsing. Library consumers use default-features = false.
cairn-keystore = { path = "../cairn-keystore", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hex = { version = "0.4", optional = true }

[features]
default = ["cli"]
cli = ["dep:cairn-keystore", "dep:clap", "dep:hex"]

[[bin]]
name = "cairn-release"
path = "src/bin/cairn-release.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"

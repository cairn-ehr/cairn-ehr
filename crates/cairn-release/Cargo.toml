[package]
name = "cairn-release"
version = "0.0.0"
description = "Cairn signed releases (ADR-0055): the trust-root / manifest / bundle documents, their canonical CBOR encoding, and (Task 3) the verifier."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Every dependency is already in the tree (AGPL-compatible, checked by cargo-deny);
# serde_bytes is already used by cairn-event. cairn-event supplies the detached signatures.
[dependencies]
cairn-event = { path = "../cairn-event" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
sha2 = "0.11"
thiserror = "1"
# The steward binary only (offline signing tool): key files, sidecar JSON, CLI parsing.
cairn-keystore = { path = "../cairn-keystore" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

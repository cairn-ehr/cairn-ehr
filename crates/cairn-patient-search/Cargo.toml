[package]
name = "cairn-patient-search"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Inherit the central workspace lint policy (#144).
[lints]
workspace = true

[dependencies]
# Deliberately minimal, exactly as cairn-medication-view is: this crate must stay
# linkable by a future picker WINDOW, which cannot depend on a crate carrying a
# Postgres driver. `v7` is omitted — this crate never MINTS a Uuid, it only carries
# ones that arrive from the database.
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# NFC normalisation of a typed name BEFORE it is tokenised (#682): a decomposed accent is a
# combining mark, not alphanumeric, so tokenising first trims or splits on it. Pure Rust, no
# I/O, MIT OR Apache-2.0 (AGPL-compatible), and already in all three lockfiles transitively —
# this adds an edge, not a crate, and keeps the "linkable by a picker window" constraint above.
unicode-normalization = "0.1"

[dev-dependencies]
# TESTS ONLY — deliberately not a real dependency, so the "linkable by a future picker
# window" constraint above is untouched. The read model derives Serialize/Deserialize and
# crosses a process boundary, so the round-trip tests need a concrete format to prove that
# with; serde_json is already a workspace-wide dependency (MIT/Apache-2.0, AGPL-compatible).
serde_json = "1"

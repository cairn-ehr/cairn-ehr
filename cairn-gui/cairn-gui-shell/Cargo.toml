[package]
name = "cairn-gui-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# No rendering framework here any more. The iced dependency — and the `gui` feature that
# gated it, and the binary behind it — was retired on 2026-08-03: released iced 0.14 ships
# no accessibility tree (spike 0004), so the reference UI moved to Tauri 2 and now lives in
# `cairn-gui-tauri`. What is left in this crate is framework-agnostic state.
[dependencies]
cairn-gui-tab = { path = "../cairn-gui-tab" }
cairn-gui-data = { path = "../cairn-gui-data" }
cairn-gui-manifest = { path = "../cairn-gui-manifest" }
cairn-gui-tab-demographics = { path = "../cairn-gui-tabs/cairn-gui-tab-demographics" }
cairn-gui-tab-note = { path = "../cairn-gui-tabs/cairn-gui-tab-note" }

[package]
name = "cairn-gui-tab-medications"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cairn-gui-tab = { path = "../../cairn-gui-tab" }
cairn-medication-view = { path = "../../../crates/cairn-medication-view" }
serde = { version = "1", features = ["derive"] }
# The rendered view speaks in Strings, but the two report renderers take GROUP ids: the
# after-the-gesture caller passes `SignOffOutcome::withheld`, which is a `Vec<Uuid>`.
uuid = "1"

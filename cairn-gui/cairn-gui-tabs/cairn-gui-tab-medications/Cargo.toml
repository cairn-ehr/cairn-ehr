[package]
name = "cairn-gui-tab-medications"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cairn-gui-tab = { path = "../../cairn-gui-tab" }
cairn-medication-view = { path = "../../../crates/cairn-medication-view" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only: the view model itself speaks in Strings, so a Uuid never crosses its public
# surface. The tests need one to build the MedicationRow fixtures they feed it.
uuid = "1"

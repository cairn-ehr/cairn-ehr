<!doctype html>
<!--
  Native semantic elements only. The browser's accessibility tree is the entire reason the
  reference UI moved off iced (spike 0004), so nothing here is a div pretending to be a
  control: a table is a <table>, a heading is an <h*>, a button is a <button>.

  DOM ORDER IS CLINICAL. The chart-level warnings sit ABOVE the table, because a screen
  reader moves through this document linearly and a warning that the chart is missing a drug
  is useless after the reader has already been told what the chart contains. That mirrors
  the accessibility contract asserted in Rust (cairn-gui-tab-medications).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cairn — Medications</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="patient-heading">Medications</h1>

      <!-- Who is signed in, and whether a key is held. Ambient, never modal: the clinician
           should see the lock, not discover it when a signature is refused. -->
      <section id="session" aria-labelledby="session-heading">
        <h2 id="session-heading" class="visually-hidden">Signing key</h2>
        <p id="lock-state" role="status" aria-live="polite">Checking signing key…</p>
        <form id="unlock-form" hidden>
          <label for="passphrase">Passphrase for your signing key</label>
          <input id="passphrase" type="password" autocomplete="current-password" />
          <button id="unlock" type="submit">Unlock</button>
        </form>
      </section>

      <!-- The two ADR-0060 reports. Empty and hidden when there is nothing to say: a
           warning that fires on every chart is a warning nobody reads. -->
      <section id="chart-warnings" aria-labelledby="warnings-heading" hidden>
        <h2 id="warnings-heading">Warnings about this chart</h2>
        <p id="chart-incomplete" hidden></p>
        <p id="chart-withheld" hidden></p>
      </section>

      <table id="med-table">
        <caption>
          Current and ceased medications, with the clinician responsible for each
        </caption>
        <thead>
          <tr>
            <th scope="col">Medication</th>
            <th scope="col">Dose</th>
            <th scope="col">Status</th>
            <th scope="col">Signature</th>
            <th scope="col">Stop this drug</th>
          </tr>
        </thead>
        <tbody id="med-rows"></tbody>
      </table>

      <p id="empty-message"></p>

      <button id="sign-off" type="button">Loading…</button>

      <!-- Outcomes land here rather than in a dialog: an act's result is information, and a
           box the clinician must dismiss is a step paper never charges them (principle 3). -->
      <p id="outcome" role="status" aria-live="polite"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>

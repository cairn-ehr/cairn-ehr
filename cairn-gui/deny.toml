# cargo-deny configuration for the GUI tree — the reference UI's supply-chain gate.
#
# WHY THIS FILE EXISTS SEPARATELY FROM THE ROOT ONE. `cairn-gui/` is its own cargo workspace
# with its own lockfile (the root workspace `exclude`s it), precisely so that wry/tao and a
# whole webview stack never enter cairn-node's dependency tree (ADR-0021 / §9.5). That
# separation is only real if the licence and advisory gates are separate too: Tauri brings
# MPL-2.0 crates that the node tree does not have and must not be allowed to acquire silently.
# Keeping the MPL allowance HERE means the root gate stays permissive-only for the
# safety-critical surface, while the tree that genuinely needs the conditional allowance
# documents the condition it is relying on.
#
# Run locally exactly as CI does:  cargo deny --manifest-path cairn-gui/Cargo.toml check

# ---------------------------------------------------------------------------------------------
# The desktop targets the reference UI is built for. Android is absent on purpose — the window
# is a workstation surface; the Android tier runs the node, which is gated by the root config.
# ---------------------------------------------------------------------------------------------
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[licenses]
# Every entry is one we have checked can be combined into an AGPL-3.0 distribution. A dependency
# introducing anything else (GPL, proprietary, or an unlicensed crate) FAILS the gate. Adding a
# license here is a deliberate, reviewed act. Confidence threshold left at the strict default.
#
# MPL-2.0 IS A COPYLEFT ENTRY AND CARRIES A CONDITION — read this before assuming it is safe.
# MPL-2.0 §3.3 lets MPL code be distributed as part of a "Larger Work" under a Secondary License,
# and the MPL names AGPL-3.0-or-later as exactly such a Secondary License, so an AGPL-3.0 Cairn
# may include it. That permission is VOID for any file carrying the MPL's Exhibit B notice
# ("Incompatible With Secondary Licenses"). Entering this tree via Tauri's webview stack in
# 2026-08 were cssparser, cssparser-macros, dtoa-short, selectors and option-ext; every one was
# checked for Exhibit B and none carries it in any source file (the phrase appears only inside
# the LICENSE text, where Exhibit B is a blank template). A future MPL crate must be checked the
# same way — `grep -rl "Incompatible With Secondary Licenses" <crate> --include='*.rs'` must come
# back empty. If it does not, that crate is a blocker, not a cleanup-later item.
allow = [
    "AGPL-3.0-only",              # our own crates (inbound = outbound)
    "MPL-2.0",                    # file-level copyleft; AGPL-compatible via §3.3 — see above
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                    # Boost — permissive
    "CC0-1.0",                    # public-domain dedication
    "ISC",
    "Unicode-3.0",               # permissive (unicode-ident, ICU crates)
    "Unlicense",                 # public domain
    "Zlib",
]

[advisories]
# Same standard as the node tree: this window handles a real medication chart. Retiring iced
# for Tauri removed the quick-xml advisories (RUSTSEC-2026-0194/0195) from this tree entirely
# (#252); this gate is what stops the next one arriving unnoticed.
version = 2
yanked = "deny"
unmaintained = "workspace"

[bans]
# Duplicate transitive versions are HYGIENE, not a safety failure, and a webview stack carries
# more of them than a server tree does. Warn (visible in CI logs) rather than fail — the same
# honest posture as the root config.
multiple-versions = "warn"
wildcards = "deny"               # a `version = "*"` dependency is never acceptable
allow-wildcard-paths = true      # …but path deps within the workspace may omit a version

[sources]
# Only crates.io (the registry we vet). An unknown registry or git source must be an explicit,
# reviewed addition — a supply-chain entry point otherwise.
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny configuration for the GUI tree — the reference UI's supply-chain gate.
#
# WHY THIS FILE EXISTS SEPARATELY FROM THE ROOT ONE. `cairn-gui/` is its own cargo workspace
# with its own lockfile (the root workspace `exclude`s it), precisely so that wry/tao and a
# whole webview stack never enter cairn-node's dependency tree (ADR-0021 / §9.5). That
# separation is only real if the licence and advisory gates are separate too: Tauri brings
# MPL-2.0 crates that the node tree does not have and must not be allowed to acquire silently.
# Keeping the MPL allowance HERE means the root gate stays permissive-only for the
# safety-critical surface, while the tree that genuinely needs the conditional allowance
# documents the condition it is relying on.
#
# Run locally exactly as CI does:  cargo deny --manifest-path cairn-gui/Cargo.toml check

# ---------------------------------------------------------------------------------------------
# The desktop targets the reference UI is built for. Android is absent on purpose — the window
# is a workstation surface; the Android tier runs the node, which is gated by the root config.
# ---------------------------------------------------------------------------------------------
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[licenses]
# Every entry is one we have checked can be combined into an AGPL-3.0 distribution. A dependency
# introducing anything else (GPL, proprietary, or an unlicensed crate) FAILS the gate. Adding a
# license here is a deliberate, reviewed act. Confidence threshold left at the strict default.
#
# MPL-2.0 IS A COPYLEFT ENTRY AND CARRIES A CONDITION — read this before assuming it is safe.
# MPL-2.0 §3.3 lets MPL code be distributed as part of a "Larger Work" under a Secondary License,
# and the MPL names AGPL-3.0-or-later as exactly such a Secondary License, so an AGPL-3.0 Cairn
# may include it. That permission is VOID for any file carrying the MPL's Exhibit B notice
# ("Incompatible With Secondary Licenses"). Entering this tree via Tauri's webview stack in
# 2026-08 were cssparser, cssparser-macros, dtoa-short, selectors and option-ext; every one was
# checked for Exhibit B and none carries it in any source file (the phrase appears only inside
# the LICENSE text, where Exhibit B is a blank template). A future MPL crate must be checked the
# same way — `grep -rl "Incompatible With Secondary Licenses" <crate> --include='*.rs'` must come
# back empty. If it does not, that crate is a blocker, not a cleanup-later item.
allow = [
    "AGPL-3.0-only",              # our own crates (inbound = outbound)
    "MPL-2.0",                    # file-level copyleft; AGPL-compatible via §3.3 — see above
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                    # Boost — permissive
    "CC0-1.0",                    # public-domain dedication
    "ISC",
    "Unicode-3.0",               # permissive (unicode-ident, ICU crates)
    "Unlicense",                 # public domain
    "Zlib",
]

[advisories]
# Same standard as the node tree: this window handles a real medication chart. Retiring iced
# for Tauri removed the quick-xml advisories (RUSTSEC-2026-0194/0195) from this tree entirely
# (#252); this gate is what stops the next one arriving unnoticed.
#
# `unsound = "all"` IS LOAD-BEARING, AND ITS ABSENCE WAS A HOLE. cargo-deny's config version 2
# defaults `unsound` to "none", so an `informational = "unsound"` advisory passed this gate in
# total silence — while GitHub's advisory database carries the same record with a MODERATE
# severity and Dependabot raises an alert on it. The gate said "advisories ok" and the security
# tab said otherwise, which is the worst of both worlds: a green check that means less than a
# reader assumes. "all" rather than "workspace" because the finding below is TRANSITIVE — a
# workspace-scoped setting would have kept missing exactly the thing that motivated the change.
# Verified 2026-08-11: turning it on surfaces ONE advisory in this tree and none in the other
# two, so it costs nothing but the honesty.
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[[advisories.ignore]]
# RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g (MODERATE) — unsoundness in glib's `VariantStrIter`
# iterator impls: a `*mut c_char` out-parameter passed as `&p` instead of `&mut p`, which recent
# rustc optimises away entirely, so `CStr::from_ptr` then dereferences NULL. Impact is a CRASH
# (CVSS VC:N/VI:L/VA:N — no disclosure, no data corruption), on Linux only, since the whole GTK
# stack is absent on macOS and Windows. No Cairn code calls it: nothing in this repo references
# `glib` at all (re-verified 2026-08-21), so reachability is entirely inside the GTK/webkit
# stack we do not drive directly.
#
# WE DO NOT PIN glib. No Cairn manifest mentions it. 0.18.5 is a transitive CEILING:
#
#     cairn-gui-tauri → tauri "2" (resolves 2.11.5, still the latest)
#       → wry/tao/muda → webkit2gtk 2.0.2 (requires gtk ^0.18.0, glib ^0.18.0)
#         → gtk 0.18.2 (requires glib ^0.18)
#
# THE EXIT CONDITION THIS ENTRY USED TO STATE WAS UNREACHABLE, which is worse than no exit
# condition: it said "remove when Tauri's Linux backend moves to gtk-rs 0.20+". There is no
# gtk-rs 0.20 for GTK3 and there will not be one. The `gtk` crate's terminal release is 0.18.2
# (2024-12-09); gtk-rs archived the GTK3 bindings and moved to the separate `gtk4` crate, which
# is the one now on glib 0.22. So watching gtk-rs releases is the WRONG SIGNAL — a reader who
# followed the old sentence would check "has 0.20 shipped?", see no, and re-defer forever.
#
# THE REAL EXIT CONDITION: Tauri's Linux backend migrating off webkit2gtk (GTK3) onto
# webkitgtk-6.0 (GTK4). That is a toolkit migration, not a version bump, and it is an upstream
# decision that may take years or may never land for Tauri v2. Check THAT, not gtk-rs versions.
#
# Bounded in time because cargo-deny 0.19.9 has no `expires` field (it accepts only `id` and
# `reason`), so an ignore is permanent by default — an open-ended suppression of a security
# advisory, which is the silent-gate shape this repo keeps finding. The `review-by` marker below
# is enforced by crates/cairn-node/tests/advisory_ignore_review_dates.rs, which FAILS once the
# date passes. Extending it is meant to be a deliberate re-decision, not a default.
#
# DO NOT silently extend this ignore to cover other advisories. One entry, one id, one rationale:
# a second finding that arrives under this block's cover is a finding nobody assessed.
id = "RUSTSEC-2024-0429"
reason = "glib 0.18.5 unsoundness (crash-only, Linux-only, unreachable from Cairn code); a transitive ceiling from tauri 2.11.5's webkit2gtk/GTK3 stack, NOT a pin of ours — patched only in glib >= 0.20, which GTK3 bindings never reach. Clears when Tauri's Linux backend moves to GTK4/webkitgtk-6.0. Tracked in issue #389. review-by 2026-11-21"

[bans]
# Duplicate transitive versions are HYGIENE, not a safety failure, and a webview stack carries
# more of them than a server tree does. Warn (visible in CI logs) rather than fail — the same
# honest posture as the root config.
multiple-versions = "warn"
wildcards = "deny"               # a `version = "*"` dependency is never acceptable
allow-wildcard-paths = true      # …but path deps within the workspace may omit a version

[sources]
# Only crates.io (the registry we vet). An unknown registry or git source must be an explicit,
# reviewed addition — a supply-chain entry point otherwise.
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "cairn-gui-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cairn-gui-tab = { path = "../cairn-gui-tab" }
# A path dependency reaching OUT of this workspace into /crates. The direction is
# GUI -> crates, which is the permitted one (nothing in /crates may ever depend on
# cairn-gui). The crate is pure — no database driver, no GUI toolkit — so this pulls no
# Postgres into the data port.
cairn-medication-view = { path = "../../crates/cairn-medication-view" }
